<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVRZ Meet</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#0b1220;
      color:white;
      min-height:100vh;
      overflow:hidden;
    }

    .background{
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle at top left,#2563eb55,transparent 30%),
      radial-gradient(circle at bottom right,#7c3aed55,transparent 30%),
      #0b1220;
      z-index:-1;
    }

    .container{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:500px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius:28px;
      padding:40px;
      box-shadow:0 20px 60px rgba(0,0,0,0.4);
      text-align:center;
    }

    .logo{
      width:90px;
      height:90px;
      margin:0 auto 20px;
      border-radius:28px;
      background:linear-gradient(135deg,#ec4899,#7c3aed);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:42px;
      box-shadow:0 10px 30px rgba(236,72,153,0.4);
    }

    h1{
      font-size:42px;
      margin-bottom:10px;
    }

    .subtitle{
      opacity:0.75;
      margin-bottom:35px;
      line-height:1.5;
    }

    .meeting-code{
      width:100%;
      padding:16px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:16px;
      margin-bottom:16px;
    }

    .buttons{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    button{
      flex:1;
      min-width:140px;
      padding:16px;
      border:none;
      border-radius:16px;
      font-size:16px;
      cursor:pointer;
      transition:0.2s ease;
      font-weight:bold;
    }

    .create{
      background:#2563eb;
      color:white;
    }

    .join{
      background:rgba(255,255,255,0.1);
      color:white;
      border:1px solid rgba(255,255,255,0.12);
    }

    button:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    .features{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:30px;
    }

    .feature{
      background:rgba(255,255,255,0.05);
      padding:14px;
      border-radius:16px;
      font-size:14px;
      opacity:0.9;
    }

    iframe{
      position:fixed;
      inset:0;
      width:100%;
      height:100vh;
      border:none;
      display:none;
      background:black;
    }

    @media(max-width:600px){
      .card{
        padding:28px;
      }

      h1{
        font-size:34px;
      }

      .features{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="background"></div>

<div class="container" id="home">
  <div class="card">

    <div class="logo">🌹</div>

    <h1>NVRZ Meet</h1>

    <p class="subtitle">
      Premium video meetings with instant room creation.
      Fast, modern and simple like Google Meet.
    </p>

    <input
      id="roomInput"
      class="meeting-code"
      placeholder="Enter meeting code"
    >

    <div class="buttons">
      <button class="create" onclick="createMeeting()">
        + New Meeting
      </button>

      <button class="join" onclick="joinMeeting()">
        Join Meeting
      </button>
    </div>

    <div class="features">
      <div class="feature">🎥 HD Video Meetings</div>
      <div class="feature">🔒 Secure Room Codes</div>
      <div class="feature">🖥 Screen Sharing</div>
      <div class="feature">💬 Real-time Chat</div>
    </div>

  </div>
</div>

<iframe
  id="meetingFrame"
  allow="camera; microphone; display-capture; fullscreen">
</iframe>

<script>

  function generateCode() {
    return Math.random().toString(36).substring(2,8).toUpperCase();
  }

  function openMeeting(code) {

    if(!code){
      alert("Please enter a meeting code");
      return;
    }

    document.getElementById("home").style.display = "none";

    const frame = document.getElementById("meetingFrame");

    frame.src = "https://sfu.mirotalk.com/join?room=" + code;

    frame.style.display = "block";
  }

  function createMeeting(){
    const code = generateCode();
    openMeeting(code);
  }

  function joinMeeting(){
    const code = document.getElementById("roomInput").value.toUpperCase();
    openMeeting(code);
  }

</script>

</body>
</html>
