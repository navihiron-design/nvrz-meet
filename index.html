<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NVRZ Meet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
    }

    .controls {
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      width: 260px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      margin-left: 10px;
      border: none;
      border-radius: 8px;
      background: #0ea5e9;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0284c7;
    }

    #meet {
      width: 100%;
      height: 80vh;
      display: none;
    }
  </style>
</head>
<body>

  <h1>NVRZ Meet</h1>

  <div class="controls">
    <input id="room" placeholder="Enter meeting code" />
    <button onclick="createMeeting()">Create Meeting</button>
    <button onclick="joinMeeting()">Join Meeting</button>
  </div>

  <p id="meetingCode"></p>

  <div id="meet"></div>

  <script src="https://meet.jit.si/external_api.js"></script>

  <script>
    function startMeeting(roomName) {
      if (!roomName) {
        alert('Please enter a meeting code');
        return;
      }

      document.querySelector('.controls').style.display = 'none';
      document.querySelector('h1').style.display = 'none';

      const domain = 'meet.jit.si';

      const options = {
        roomName: roomName,
        parentNode: document.querySelector('#meet'),
        width: '100%',
        height: '100%',
      };

      document.getElementById('meet').style.display = 'block';

      new JitsiMeetExternalAPI(domain, options);
    }

    function createMeeting() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();

      document.getElementById('meetingCode').innerHTML =
        'Meeting Code: <strong>' + code + '</strong>';

      startMeeting(code);
    }

    function joinMeeting() {
      const code = document.getElementById('room').value.toUpperCase();
      startMeeting(code);
    }
  </script>

</body>
</html>
